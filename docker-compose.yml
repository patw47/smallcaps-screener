services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - data:/app/data
      - ./config:/app/config
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - EDGAR_USER_AGENT=${EDGAR_USER_AGENT:-}
      - REQUIRE_LOCAL_CONFIG=${REQUIRE_LOCAL_CONFIG:-}
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      # Le conteneur lance `vite dev` : en montant le source, une édition recharge le
      # navigateur au lieu d'exiger un rebuild.
      # Le volume anonyme garde le node_modules de l'image, que le montage masquerait.
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      - backend
    restart: always

volumes:
  data:
