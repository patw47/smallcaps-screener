# config/local.example.yml — modèle de configuration locale.
#
# Copier vers config/local.yml (gitignoré) puis renseigner les vraies valeurs :
#   cp config/local.example.yml config/local.yml
#
# Chargé au démarrage du backend s'il existe ; sans fichier, les defaults du code
# s'appliquent. Sections autorisées : filters, finviz, study. Toute clé de `filters`
# absente des defaults fait échouer le démarrage (protection typo — une faute de
# frappe ne doit jamais laisser silencieusement la valeur par défaut).
#
# REQUIRE_LOCAL_CONFIG=1 : le backend refuse de démarrer sans ce fichier.

# Surcharges de FILTERS (backend/screener_backend.py) — merge profond, clé par clé.
filters: {}

# Export Finviz Elite (backend/finviz.py) : lien d'export SANS son paramètre
# d'authentification, et le jeton. Sans jeton, le module est inactif.
finviz: {}
#   export_url: ""
#   token: ""

# Étude Epic 15 S1 (make study-earnings) : chemin du lac ta-patterns, lu en lecture seule.
study: {}
#   ta_patterns_dir: /home/<user>/ta-patterns
