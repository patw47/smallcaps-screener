services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - data:/app/data
      - ./config:/app/config
      # Double des instantanés sur le disque hôte (Epic 11 S1) : sans ce montage, les
      # observations datées n'existent qu'en un exemplaire, dans le volume `data`.
      - ./backups:/app/backup
    environment:
      - SCAN_EVERY_HOURS=${SCAN_EVERY_HOURS:-24}
      - BACKUP_DIR=${BACKUP_DIR:-/app/backup}
      - SCAN_TRADING_DAYS_ONLY=${SCAN_TRADING_DAYS_ONLY:-true}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - EDGAR_USER_AGENT=${EDGAR_USER_AGENT:-}
      # Export des résultats terminés (Epic 11 S2) — vides = export désactivé
      # silencieusement, le scan tourne normalement.
      - NOTION_API_KEY=${NOTION_API_KEY:-}
      - NOTION_RESULTS_DB_ID=${NOTION_RESULTS_DB_ID:-}
      - REQUIRE_LOCAL_CONFIG=${REQUIRE_LOCAL_CONFIG:-}
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      # Le conteneur lance `vite dev` : en montant le source, une édition recharge le
      # navigateur au lieu d'exiger un rebuild — lequel recréait aussi le backend et
      # relançait donc un scan complet (cache périmé au bout de cache_minutes).
      # Le volume anonyme garde le node_modules de l'image, que le montage masquerait.
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      - backend
    restart: always

volumes:
  data:
